---
# Example starter inventory. secretweb_wants_openvpn_server/_client vary
# per host - not every host runs both (or either) unit, so they're set
# here rather than hardcoded in the systemd unit template.
all:
  children:
    secretweb_hosts:
      hosts:
        example1.domain.some:
          secretweb_wants_openvpn_server: true
          secretweb_wants_openvpn_client: false
        example2.domain.some:
          secretweb_wants_openvpn_server: false
          secretweb_wants_openvpn_client: true
        example3.domain.some:
          secretweb_wants_openvpn_server: false
          secretweb_wants_openvpn_client: true
